<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dynamite Mole</title>
<link rel="icon" href="./favicon.png" type="image/png">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #08060c; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; touch-action: none; background: #08060c; }
  #touch { position: relative; height: 156px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; padding: 4px 14px; touch-action: none; }
  #touch[hidden] { display: none; }
  #dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 0; }
  #touch button { border: 0; padding: 0; margin: 0; background: transparent var(--up) center / 100% 100% no-repeat; image-rendering: pixelated; touch-action: none; -webkit-tap-highlight-color: transparent; outline: none; }
  #touch button.down { background-image: var(--dn); }
  #b-u { grid-column: 2; grid-row: 1; } #b-l { grid-column: 1; grid-row: 2; } #b-r { grid-column: 3; grid-row: 2; } #b-d { grid-column: 2; grid-row: 3; }
  #b-bomb { width: 96px; height: 96px; }
  #b-pause { position: absolute; left: 50%; top: 6px; width: 84px; height: 32px; margin-left: -42px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="480" height="416" aria-label="Dynamite Mole"></canvas>
  <div id="touch" hidden>
    <div id="dpad">
      <button id="b-u" aria-label="up"></button>
      <button id="b-l" aria-label="left"></button>
      <button id="b-r" aria-label="right"></button>
      <button id="b-d" aria-label="down"></button>
    </div>
    <button id="b-pause" aria-label="pause"></button>
    <button id="b-bomb" aria-label="bomb"></button>
  </div>
</div>
<script src="./pix.js"></script>
<script src="./font.js"></script>
<script src="./sprites.js"></script>
<script src="./titleart.js"></script>
<script src="./audio.js"></script>
<script src="./logic.js"></script>
<script src="./render.js"></script>
<script src="./main.js"></script>
</body>
</html>
