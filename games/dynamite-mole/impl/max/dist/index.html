<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07050d">
<title>Dynamite Mole</title>
<link rel="icon" href="./favicon.png" type="image/png">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07050d; }
  body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
         -webkit-tap-highlight-color: transparent; }
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: stretch; }
  #view { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #game { display: block; image-rendering: pixelated; touch-action: none; outline: none; background: #07050d; }
  #touch { display: none; flex: 0 0 auto; position: relative; width: 100%; box-sizing: border-box;
           padding: 6px 14px calc(8px + env(safe-area-inset-bottom)); touch-action: none; background: #0d0916; }
  #touch.on { display: block; }
  #touch .pad, #touch .btn { position: absolute; touch-action: none; }
  #touch button { position: absolute; margin: 0; padding: 0; border: 0; background-color: transparent;
                  background-repeat: no-repeat; background-position: center; background-size: 100% 100%;
                  image-rendering: pixelated; touch-action: none; -webkit-tap-highlight-color: transparent; outline: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="view"><canvas id="game" width="480" height="416" tabindex="-1" role="img" aria-label="Dynamite Mole game screen"></canvas></div>
  <div id="touch"></div>
</div>
<script src="./js/util.js"></script>
<script src="./js/level.js"></script>
<script src="./js/font.js"></script>
<script src="./js/pix.js"></script>
<script src="./js/art.js"></script>
<script src="./js/art_chars.js"></script>
<script src="./js/art_tiles.js"></script>
<script src="./js/art_ui.js"></script>
<script src="./js/synth.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/game.js"></script>
<script src="./js/title.js"></script>
<script src="./js/render.js"></script>
<script src="./js/touch.js"></script>
<script src="./js/input.js"></script>
<script src="./js/main.js"></script>
<script>DM.boot();</script>
</body>
</html>
