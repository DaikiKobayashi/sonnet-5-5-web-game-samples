<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dynamite Mole</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
html,body{margin:0;height:100%;background:#0a0806;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
#game{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
#touch{display:none;width:100%;height:150px;flex:none;align-items:center;justify-content:space-between;padding:0 12px;box-sizing:border-box}
#touch.on{display:flex}
.pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:2px}
.b{background:#4a3520;color:#ffd27a;border:3px solid #8a6a3a;border-radius:8px;font:bold 14px monospace;display:flex;align-items:center;justify-content:center;touch-action:none}
.b.dn{background:#8a6a3a;color:#fff}
#bomb{width:96px;height:96px;border-radius:48px;background:#8a2a20;border-color:#e0603a}
#pause{width:80px;height:40px}
</style>
</head>
<body>
<canvas id="game" width="480" height="416"></canvas>
<div id="touch">
<div class="pad">
<div></div><div class="b" data-k="ArrowUp">UP</div><div></div>
<div class="b" data-k="ArrowLeft">LT</div><div></div><div class="b" data-k="ArrowRight">RT</div>
<div></div><div class="b" data-k="ArrowDown">DN</div><div></div>
</div>
<div class="b" id="pause" data-k="KeyP">PAUSE</div>
<div class="b" id="bomb" data-k="Space">BOMB</div>
</div>
<script src="./font.js"></script>
<script src="./art.js"></script>
<script src="./audio.js"></script>
<script src="./game.js"></script>
</body>
</html>
