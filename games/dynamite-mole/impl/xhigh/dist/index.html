<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0810">
<title>Dynamite Mole</title>
<link rel="icon" href="./favicon.png" type="image/png">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0810;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    touch-action: none;
  }
  #stage {
    flex: 0 0 auto;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #game {
    display: block;
    -ms-interpolation-mode: nearest-neighbor;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    background: #000;
    outline: none;
  }
  #touch {
    flex: 0 0 auto;
    height: 176px;
    box-sizing: border-box;
    padding: 8px 14px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #16101e;
    border-top: 3px solid #6a4a2a;
    touch-action: none;
  }
  #touch[hidden] { display: none; }
  #dpad {
    position: relative;
    width: 150px;
    height: 150px;
    flex: 0 0 auto;
  }
  .tb {
    position: absolute;
    width: 50px;
    height: 50px;
    margin: 0;
    padding: 0;
    border: 3px solid #e0b060;
    border-radius: 8px;
    background-color: #3a2a48;
    background-repeat: no-repeat;
    background-position: center;
    image-rendering: pixelated;
    touch-action: none;
    -webkit-touch-callout: none;
    cursor: pointer;
  }
  .tb.on { background-color: #7a5a98; border-color: #fff2c0; transform: translateY(2px); }
  #btn-up { left: 50px; top: 0; }
  #btn-left { left: 0; top: 50px; }
  #btn-right { left: 100px; top: 50px; }
  #btn-down { left: 50px; top: 100px; }
  #dpad::after {
    content: '';
    position: absolute;
    left: 50px; top: 50px; width: 50px; height: 50px;
    background: #24183a;
    border-radius: 8px;
    z-index: -1;
  }
  #btn-bomb {
    width: 96px;
    height: 96px;
    border-radius: 48px;
    background-color: #b02a2a;
    position: static;
  }
  #btn-bomb.on { background-color: #e04a3a; }
  #btn-pause {
    width: 84px;
    height: 36px;
    position: static;
    border-radius: 6px;
    align-self: flex-start;
    margin-top: 6px;
  }
  #mid { display: flex; flex-direction: column; align-items: center; height: 100%; }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="480" height="416" tabindex="-1"></canvas></div>
<div id="touch" hidden>
  <div id="dpad">
    <button class="tb" id="btn-up" aria-label="UP" type="button"></button>
    <button class="tb" id="btn-left" aria-label="LEFT" type="button"></button>
    <button class="tb" id="btn-right" aria-label="RIGHT" type="button"></button>
    <button class="tb" id="btn-down" aria-label="DOWN" type="button"></button>
  </div>
  <div id="mid"><button class="tb" id="btn-pause" aria-label="PAUSE" type="button"></button></div>
  <button class="tb" id="btn-bomb" aria-label="BOMB" type="button"></button>
</div>
<script src="./js/util.js"></script>
<script src="./js/raster.js"></script>
<script src="./js/font.js"></script>
<script src="./js/sprites_mole.js"></script>
<script src="./js/sprites_enemy.js"></script>
<script src="./js/sprites_tiles.js"></script>
<script src="./js/sprites_ui.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/level.js"></script>
<script src="./js/game.js"></script>
<script src="./js/render.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
